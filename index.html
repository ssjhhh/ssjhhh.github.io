<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遇AI · 选人聊天</title>
<style>
  :root{
    --canvas:#f7f3ec;
    --surface:#ffffff;
    --surface-soft:#efe9de;
    --ink:#2f2a24;
    --ink-2:#6f665b;
    --line:#e3dccf;
    --accent:#c96f3f;
    --accent-ink:#ffffff;
    --focus:#b95f33;
    --ok:#4f7a4f;
    --radius-lg:22px;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 10px 30px rgba(64,52,38,.10);
    --shadow-sm:0 3px 12px rgba(64,52,38,.08);
    --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --space-1:8px;--space-2:14px;--space-3:22px;--space-4:34px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);background:var(--canvas);color:var(--ink);
    line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased;
  }
  [data-accent="#c96f3f"]{--accent:#c96f3f;--soft:#f7e3d4}
  [data-accent="#4f7a4f"]{--accent:#4f7a4f;--soft:#dce9d9}
  [data-accent="#3e6f9c"]{--accent:#3e6f9c;--soft:#d9e4ef}
  [data-accent="#7a5aa6"]{--accent:#7a5aa6;--soft:#e5def0}
  [data-accent="#2f6f6f"]{--accent:#2f6f6f;--soft:#d6e8e8}
  [data-accent="#a04f6f"]{--accent:#a04f6f;--soft:#f0dce4}
  [data-accent="#8a7038"]{--accent:#8a7038;--soft:#ece2c8}

  .app{max-width:1080px;margin:0 auto;padding:var(--space-4) var(--space-3)}
  h1{font-size:clamp(1.6rem,3.6vw,2.4rem);line-height:1.2;margin:0 0 6px;letter-spacing:.5px}
  .lead{color:var(--ink-2);margin:0 0 var(--space-4);font-size:1.02rem}
  .section-label{font-size:.82rem;letter-spacing:.12em;color:var(--ink-2);margin:var(--space-3) 0 var(--space-2);text-transform:uppercase}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--space-2)}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:var(--space-3);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;
    display:flex;flex-direction:column;gap:var(--space-2);position:relative;min-width:0;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .card:active{transform:translateY(0)}
  .card:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .card-top{display:flex;align-items:center;gap:var(--space-2)}
  .avatar{width:64px;height:64px;flex:0 0 auto;border-radius:50%;border:3px solid var(--accent);background:var(--soft);overflow:hidden}
  .avatar svg{width:100%;height:100%;display:block}
  .who{min-width:0}
  .who .name{font-size:1.14rem;font-weight:700}
  .who .role{font-size:.82rem;color:var(--accent);font-weight:600}
  .who .status{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;color:var(--ink-2);margin-top:3px}
  .who .status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:.74rem;background:var(--surface-soft);padding:2px 9px;border-radius:999px;color:var(--ink-2)}
  .card p{font-size:.9rem;color:var(--ink-2);margin:0;flex:1}
  .enter{margin-top:auto;display:inline-block;width:fit-content;font-size:.86rem;font-weight:600;color:var(--accent)}

  .chat{display:none;max-width:760px;margin:0 auto;flex-direction:column;height:calc(100vh - 40px)}
  .chat.open{display:flex}
  .chat-head{display:flex;align-items:center;gap:var(--space-2);padding:10px 0;border-bottom:1px solid var(--line)}
  .chat-head .avatar{width:44px;height:44px;border-width:2px}
  .chat-head .back{font-size:1.4rem;line-height:1;background:none;border:none;cursor:pointer;color:var(--ink);padding:4px 8px;border-radius:8px}
  .chat-head .back:hover{background:var(--surface-soft)}
  .chat-head h2{margin:0;font-size:1.1rem}
  .chat-head .role{font-size:.78rem;color:var(--accent);font-weight:600}
  .msgs{flex:1;overflow-y:auto;padding:var(--space-3) 2px;display:flex;flex-direction:column;gap:var(--space-2)}
  .msg{display:flex;gap:10px;max-width:82%;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .mini{width:36px;height:36px;flex:0 0 auto;border-radius:50%;border:2px solid var(--accent);overflow:hidden;background:var(--soft)}
  .msg.bot{align-self:flex-start}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .bubble{padding:10px 14px;border-radius:16px;font-size:.95rem;white-space:pre-wrap;overflow-wrap:break-word}
  .msg.bot .bubble{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
  .msg.user .bubble{background:var(--accent);color:var(--accent-ink);border-top-right-radius:4px}
  .tips{margin:2px 0 0 46px;font-size:.74rem;color:var(--ink-2)}
  .composer{display:flex;gap:10px;padding:12px 0 6px;border-top:1px solid var(--line)}
  .composer input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-size:.95rem;font-family:var(--font);background:var(--surface)}
  .composer .btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:0 20px;font-size:1rem;cursor:pointer;font-weight:600}
  .composer .btn:hover{filter:brightness(1.06)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:560px){
    .app{padding:var(--space-3) var(--space-2)}
    .grid{grid-template-columns:1fr}
  }
  @media print{
    body{background:#fff}
    .card{border-color:#000}
    .enter,.chat{display:none}
    .grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<main class="app" id="app">
  <header>
    <h1 id="pageTitle">遇AI · 选个人，聊聊心里话</h1>
    <p class="lead" id="pageLead">选一位你喜欢的人，进入和 TA 的专属对话。</p>
  </header>

  <section aria-label="选择聊天对象">
    <div id="grid" class="grid"></div>
  </section>

  <section id="chat" class="chat" aria-label="对话">
    <div class="chat-head">
      <button class="back" id="backBtn" aria-label="返回选择人物">‹</button>
      <div class="avatar" id="headAvatar" aria-hidden="true"></div>
      <div>
        <h2 id="headName"></h2>
        <div class="role" id="headRole"></div>
      </div>
    </div>
    <div class="msgs" id="msgs" role="log" aria-live="polite"></div>
    <div class="tips">输入的只是一句问候，TA 会以各自的方式回应。</div>
    <form class="composer" id="composer" autocomplete="off">
      <label for="input" class="visually-hidden" style="position:absolute;left:-9999px">输入消息</label>
      <input id="input" type="text" placeholder="说点什么…" aria-label="输入消息">
      <button class="btn" type="submit">发送</button>
    </form>
  </section>
</main>

<script>
(function(){
  'use strict';
  var AV = {
    elder:'<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img"><title>慈祥老人</title><circle cx="40" cy="40" r="40" fill="#f7e3d4"/><path d="M14 34c0-16 12-27 26-27s26 11 26 27v8H14z" fill="#e8d3bd"/><path d="M22 26c1-15 8-19 18-19V6c14 0 23 10 23 22v6H22z" fill="#c9c2c9"/><circle cx="34" cy="44" r="4" fill="#3a332c"/><circle cx="52" cy="44" r="4" fill="#3a332c"/><path d="M32 52c3 2 13 3 20-1" stroke="#3a332c" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M0 60c14 8 66 8 80 0v20H0z" fill="#c96f3f"/></svg>',
    child:'<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img"><title>可爱小孩</title><circle cx="40" cy="40" r="40" fill="#dce9d9"/><path d="M14 34c0-15 11-25 26-25s26 10 26 25v8H14z" fill="#f4c8a0"/><circle cx="33" cy="28" r="5" fill="#f4c8a0"/><path d="M28 24c0-4 3-7 7-7 4 0 7 3 7 7" stroke="#3a332c" stroke-width="2" fill="none"/><circle cx="34" cy="46" r="4" fill="#3a332c"/><circle cx="52" cy="46" r="4" fill="#3a332c"/><path d="M32 54c6 4 13-1 19-2" stroke="#3a332c" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M0 60c14 8 66 8 80 0v20H0z" fill="#4f7a4f"/></svg>',
    worker:'<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img"><title>职场青年</title><circle cx="40" cy="40" r="40" fill="#d9e4ef"/><path d="M14 34c0-15 11-26 26-26s26 11 26 26v9H14z" fill="#e5b48a"/><path d="M22 12h36v14H22z" fill="#3e6f9c"/><path d="M32 12v10M40 12v10M48 12v10" stroke="#a8c4dd" stroke-width="3"/><circle cx="34" cy="46" r="4" fill="#3a332c"/><circle cx="52" cy="46" r="4" fill="#3a332c"/><path d="M33 55c5 2 10 2 15-1" stroke="#3a332c" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M0 60c14 8 66 8 80 0v20H0z" fill="#2f5f8a"/></svg>',
    student:'<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img"><title>青春学生</title><circle cx="40" cy="40" r="40" fill="#e5def0"/><path d="M14 34c0-15 11-26 26-26s26 11 26 26v9H14z" fill="#f1c9a6"/><path d="M20 10l20 9 20-9v12H20z" fill="#7a5aa6"/><circle cx="34" cy="46" r="4" fill="#3a332c"/><circle cx="52" cy="46" r="4" fill="#3a332c"/><path d="M32 55c10 5 18-3 20-5" stroke="#3a332c" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M0 60c14 8 66 8 80 0v20H0z" fill="#5d3f8f"/></svg>',
    doc:'<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img"><title>暖心医护</title><circle cx="40" cy="40" r="40" fill="#d6e8e8"/><path d="M14 34c0-15 11-26 26-26s26 11 26 26v9H14z" fill="#eab98e"/><path d="M40 20v20M30 30h20" stroke="#2f6f6f" stroke-width="5" stroke-linecap="round"/><circle cx="34" cy="50" r="4" fill="#3a332c"/><circle cx="52" cy="50" r="4" fill="#3a332c"/><path d="M32 59c6 2 12 0 18-2" stroke="#3a332c" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M0 62c14 7 66 7 80 0v18H0z" fill="#2f6f6f"/></svg>',
    poet:'<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img"><title>文艺青年</title><circle cx="40" cy="40" r="40" fill="#f0dce4"/><path d="M14 34c0-15 11-26 26-26s26 11 26 26v9H14z" fill="#ecc0a0"/><path d="M26 12c0-7 9-7 9 0 0 5-4 6-4 10M40 12c0-7 9-7 9 0 0 5-4 6-4 10" stroke="#6b5640" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="34" cy="46" r="4" fill="#3a332c"/><circle cx="52" cy="46" r="4" fill="#3a332c"/><path d="M31 54c11 7 20 0 20-4" stroke="#3a332c" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M0 60c14 8 66 8 80 0v20H0z" fill="#a04f6f"/></svg>',
    chef:'<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img"><title>美食大厨</title><circle cx="40" cy="40" r="40" fill="#ece2c8"/><path d="M14 34c0-15 11-26 26-26s26 11 26 26v9H14z" fill="#f1c79e"/><path d="M20 34h40l-4 8H24z" fill="#e9ecf1"/><path d="M28 22c0-9 8-9 8-2 0 4-3 5-3 9M46 22c0-9 8-9 8-2 0 4-3 5-3 9" stroke="#8a7038" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="34" cy="48" r="4" fill="#3a332c"/><circle cx="52" cy="48" r="4" fill="#3a332c"/><path d="M32 57c6 2 12 0 18-2" stroke="#3a332c" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M0 62c14 7 66 7 80 0v18H0z" fill="#b6812f"/></svg>'
  };

  var PEOPLE = [
    {id:'elder', name:'李爷爷', role:'慈祥老人', accent:'#c96f3f', svg:AV.elder,
     tags:['人生哲理','家常','倾听'], desc:'慢悠悠地跟你聊往事和道理，爱说“孩子啊”。',
     reply:function(t){return '孩子啊，'+(t||'你来了')+'。我像你这般年纪，也总爱跟人说话……慢慢道来，不着急。'} },
    {id:'child', name:'朵朵', role:'可爱小孩', accent:'#4f7a4f', svg:AV.child,
     tags:['童趣','奇思妙想','玩伴'], desc:'天真烂漫，什么都想问，什么都敢说。',
     reply:function(t){return '嘿嘿，'+ (t||'嘿嘿') +'！我也好喜欢说话呀～你知道为什么星星会眨眼吗？'} },
    {id:'worker', name:'阿哲', role:'职场青年', accent:'#3e6f9c', svg:AV.worker,
     tags:['职场','效率','清醒'], desc:'工作生活的队友，和你聊目标、选择与坚持。',
     reply:function(t){return t?('嗯，'+t+'。这事啊，咱们拆开看：先定目标，再看手头有什么，一步步来。'):'聊聊近况吧，最近忙什么？'} },
    {id:'student', name:'小雨', role:'青春学生', accent:'#7a5aa6', svg:AV.student,
     tags:['学习','成长','能量'], desc:'陪你复习功课、聊聊爱好与梦想的同龄少年。',
     reply:function(t){return '对呀，'+ (t||'你想聊什么') +'！我觉得学习和喜欢的事都要认真对待～'} },
    {id:'doc', name:'林医生', role:'暖心医护', accent:'#2f6f6f', svg:AV.doc,
     tags:['健康','关怀','专业'], desc:'温和平实，关心你的身体与心情。',
     reply:function(t){return (t||'你好')+'。听起来有一点累吧？身体健康和心情放松都很重要，说说看？'} },
    {id:'poet', name:'然然', role:'文艺青年', accent:'#a04f6f', svg:AV.poet,
     tags:['文艺','情绪','美'], desc:'善解人意，把情绪和风景说得很美。',
     reply:function(t){return (t||'你来啦')+'呀。有时候一句话就能装下很多情绪，你想说说此刻的心情吗？'} },
    {id:'chef', name:'老周', role:'美食大厨', accent:'#8a7038', svg:AV.chef,
     tags:['美食','菜谱','烟火气'], desc:'讲究吃，也讲究把日子过得有滋有味。',
     reply:function(t){return '说到吃，我就来劲！'+(t||'+1')+'，要不要聊聊今天吃点啥？'} }
  ];

  var grid = document.getElementById('grid'),
      chat = document.getElementById('chat'),
      msgs = document.getElementById('msgs'),
      title = document.getElementById('pageTitle'),
      lead = document.getElementById('pageLead');

  function renderGrid(){
    grid.innerHTML = PEOPLE.map(function(p){
      return '<article class="card" tabindex="0" role="button" data-accent="'+p.accent+'" data-id="'+p.id+'" aria-label="与'+p.name+'聊天">'+
        '<div class="card-top"><div class="avatar">'+p.svg+'</div>'+
        '<div class="who"><div class="name">'+p.name+'</div><div class="role">'+p.role+'</div>'+
        '<div class="status">在线</div></div></div>'+
        '<div class="tags">'+p.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div>'+
        '<p>'+p.desc+'</p><span class="enter">开始对话 →</span>'+
      '</article>';
    }).join('');
  }

  function enterChat(p){
    document.getElementById('headAvatar').innerHTML = p.svg;
    document.getElementById('headName').textContent = p.name;
    document.getElementById('headRole').textContent = p.role;
    chat.dataset.accent = p.accent;
    chat.setAttribute('data-accent', p.accent);
    document.getElementById('headAvatar').setAttribute('data-accent', p.accent);
    msgs.innerHTML='';
    addBubble('bot', p.reply(''));
    app.classList.add('chat-mode');
    chat.classList.add('open');
    title.style.display='none'; lead.style.display='none';
    document.getElementById('input').focus();
  }
  function exitChat(){
    chat.classList.remove('open'); chat.classList.remove('chat-mode');
    title.style.display=''; lead.style.display='';
  }
  function addBubble(who, text){
    var cur = PEOPLE.filter(function(p){return p.id===currentId})[0];
    var d=document.createElement('div');
    d.className='msg '+who;
    if(who==='bot'){ d.appendChild(mini(cur)); var b=document.createElement('div'); b.className='bubble'; b.textContent=text; d.appendChild(b); }
    else{ var b=document.createElement('div'); b.className='bubble'; b.textContent=text; d.appendChild(b); }
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  }
  function mini(p){ var s=document.createElement('span'); s.className='mini'; s.innerHTML=p.svg; s.setAttribute('data-accent',p.accent); return s; }

  var currentId=null;
  grid.addEventListener('click', function(e){
    var card=e.target.closest('.card'); if(!card) return;
    currentId=card.getAttribute('data-id');
    enterChat(PEOPLE.filter(function(p){return p.id===currentId})[0]);
  });
  grid.addEventListener('keydown', function(e){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); var card=e.target.closest('.card'); if(card) card.click(); }
  });
  document.getElementById('backBtn').addEventListener('click', exitChat);

  var form=document.getElementById('composer');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var input=document.getElementById('input'), v=input.value.trim();
    if(!v||!currentId) return;
    addBubble('user', v);
    var p=PEOPLE.filter(function(x){return x.id===currentId})[0];
    setTimeout(function(){ addBubble('bot', p.reply(v)); }, 420);
    input.value='';
  });

  renderGrid();
})();
</script>
</body>
</html>
