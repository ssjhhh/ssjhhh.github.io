<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖心聊天室</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf6ef;
    --card: #ffffff;
    --ink: #40382f;
    --muted: #9a8f80;
    --accent: #e07a5f;
    --line: #efe6d8;
    --radius: 18px;
    --shadow: 0 8px 30px rgba(90, 70, 50, .08);
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100%; }

  .topbar {
    position: fixed; top: 14px; right: 16px; z-index: 30;
    display: flex; gap: 8px;
  }
  .topbar button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-family: inherit; font-size: 13px; cursor: pointer;
    padding: 7px 14px; border-radius: 999px; box-shadow: var(--shadow);
  }
  .topbar button:hover { border-color: var(--accent); color: var(--accent); }

  .hero { max-width: 780px; margin: 0 auto; padding: 72px 24px 48px; text-align: center; }
  .logo { font-size: 40px; margin-bottom: 10px; }
  .title { font-size: 34px; font-weight: 700; letter-spacing: .5px; }
  .subtitle { color: var(--muted); margin-top: 10px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 42px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card {
    position: relative; border: 1px solid var(--line); background: var(--card);
    border-radius: var(--radius); padding: 28px 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    transition: transform .18s ease, box-shadow .18s ease; font-family: inherit; color: inherit;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
  .card::before {
    content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 34px; height: 3px; border-radius: 3px; background: var(--c); opacity: .7;
  }
  .avatar { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 38px; background: var(--bg, #fbe9e2); }
  .avatar.sm { width: 44px; height: 44px; font-size: 24px; }
  .avatar.xs { width: 30px; height: 30px; font-size: 16px; flex-shrink: 0; }
  .name { font-weight: 600; font-size: 17px; }
  .tag { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .footer { color: var(--muted); font-size: 12px; margin-top: 48px; }

  .chat { max-width: 780px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  .chathead {
    display: flex; align-items: center; gap: 14px; padding: 16px 20px;
    border-bottom: 1px solid var(--line); background: rgba(250, 246, 239, .94);
    backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 5;
  }
  .back { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; font-family: inherit; padding: 6px 10px; border-radius: 10px; }
  .back:hover { color: var(--ink); background: rgba(0, 0, 0, .04); }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who .name { font-size: 16px; }
  .who .tag { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .messages { flex: 1; overflow-y: auto; padding: 26px 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; align-items: flex-end; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 74%; padding: 12px 16px; border-radius: 16px; line-height: 1.65;
    font-size: 15px; white-space: pre-wrap; word-break: break-word;
    background: var(--card); box-shadow: var(--shadow);
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
  .msg.assistant .bubble { border-bottom-left-radius: 6px; }
  .typing { display: flex; gap: 5px; align-items: center; padding: 17px 16px; }
  .typing .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing .dot:nth-child(2) { animation-delay: .2s; }
  .typing .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .inputbar { display: flex; gap: 10px; padding: 14px 20px 18px; border-top: 1px solid var(--line); background: var(--bg); }
  .input { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 24px; padding: 12px 18px; font-size: 15px; font-family: inherit; color: var(--ink); outline: none; }
  .input:focus { border-color: var(--accent); }
  .send { border: none; background: var(--accent); color: #fff; font-size: 15px; font-family: inherit; padding: 12px 22px; border-radius: 24px; cursor: pointer; font-weight: 600; }
  .send:hover { filter: brightness(1.05); }
  .send:disabled { opacity: .5; cursor: default; }

  .overlay {
    position: fixed; inset: 0; background: rgba(60, 45, 30, .35); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .overlay.show { display: flex; }
  .modal {
    width: 100%; max-width: 440px; background: var(--card); border-radius: 16px;
    padding: 28px 26px 24px; box-shadow: 0 30px 70px rgba(0, 0, 0, .25);
  }
  .modal h2 { font-size: 20px; margin-bottom: 4px; }
  .modal .tip { color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
  .field-label { font-size: 13px; color: var(--ink); margin: 14px 0 6px; font-weight: 600; }
  .field {
    width: 100%; font-family: inherit; font-size: 14px; color: var(--ink);
    padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 10px; outline: none; background: #fffdfa;
  }
  .field:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1; border: none; font-family: inherit; font-size: 15px; cursor: pointer;
    padding: 11px; border-radius: 12px; font-weight: 600;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn:hover { filter: brightness(1.05); }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="topbar">
    <button id="settingsBtn" type="button">⚙ 接口设置</button>
  </div>

  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <h2>接口设置</h2>
      <p class="tip">填写任意兼容 OpenAI 的接口即可真实对话。密钥只保存在你的浏览器 localStorage 里，不会上传。若浏览器提示跨域（CORS）错误，请改用支持跨域的地址或你自己的后端/代理。</p>
      <div class="field-label">API Key</div>
      <input class="field" id="apiKeyInput" type="password" placeholder="sk-..." autocomplete="off">
      <div class="field-label">Base URL</div>
      <input class="field" id="baseUrlInput" type="text" placeholder="https://api.deepseek.com" autocomplete="off">
      <div class="field-label">Model</div>
      <input class="field" id="modelInput" type="text" placeholder="deepseek-chat" autocomplete="off">
      <div class="modal-actions">
        <button class="btn ghost" id="settingsCancel" type="button">取消</button>
        <button class="btn primary" id="settingsSave" type="button">保存</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var PERSONAS = [
    {
      id: 'grandma', name: '奶奶', emoji: '👵',
      tagline: '慢悠悠地听你说，给你最暖的回应', color: '#e07a5f', bg: '#fbe9e2',
      greeting: '乖孩子，来啦。今天过得怎么样呀？', temperature: 0.9,
      system: '你是对方慈祥温柔的奶奶，七十来岁。说话慢悠悠、和蔼可亲，爱用家常口语，会关心对方吃饭了没、累不累、心情好不好，喜欢分享生活小智慧和过去的故事。称呼对方为孩子或乖孩子。请始终以奶奶的身份自然聊天，用中文，回复简短，一般两到五句，像真人一样，不要提及你是AI或模型，不要使用列表或Markdown格式。'
    },
    {
      id: 'grandpa', name: '爷爷', emoji: '👴',
      tagline: '沉稳讲道理，爱唠家常和历史', color: '#b08968', bg: '#f3ead9',
      greeting: '孩子，坐。有什么想跟爷爷唠唠的？', temperature: 0.9,
      system: '你是对方温和睿智的爷爷，七十来岁。说话沉稳、有耐心，爱讲道理和小故事，喜欢下棋、喝茶、聊历史，会耐心开导对方。称呼对方为孩子。请始终以爷爷的身份自然聊天，用中文，回复简短，一般两到五句，像真人一样，不要提及你是AI或模型，不要使用列表或Markdown格式。'
    },
    {
      id: 'mother', name: '妈妈', emoji: '🤱',
      tagline: '温柔体贴，总担心你有没有好好吃饭', color: '#d98880', bg: '#fbe6e4',
      greeting: '宝贝，忙完啦？吃饭了没有？', temperature: 0.9,
      system: '你是对方温柔体贴的妈妈。你总是担心对方有没有好好吃饭、穿得暖不暖、累不累，语气温暖又带点唠叨，充满爱意，会给出生活上的关心和实用建议。称呼对方为宝贝或孩子。请始终以妈妈的身份自然聊天，用中文，回复简短，一般两到五句，像真人一样，不要提及你是AI或模型，不要使用列表或Markdown格式。'
    },
    {
      id: 'child', name: '小孩', emoji: '🧒',
      tagline: '天真好奇，爱问为什么', color: '#e9b44c', bg: '#fdf3d8',
      greeting: '哇，你来啦！我们聊点什么好玩的呀？', temperature: 0.95,
      system: '你是一个七岁、天真好奇的小朋友。说话简单直接，爱问为什么，充满想象力，喜欢分享学校里的小事，会使用哇、嘿嘿、呀等语气词，回答问题时用小朋友能听懂的大白话。请始终以小朋友的身份自然聊天，用中文，回复简短，一般一两到三句，像真人一样，不要提及你是AI或模型，不要使用列表或Markdown格式。'
    },
    {
      id: 'classmate', name: '同学', emoji: '🧑‍🎓',
      tagline: '同龄好伙伴，轻松又随意', color: '#6a9b8f', bg: '#e4f0eb',
      greeting: '嘿，来啦！今天有啥新鲜事没？', temperature: 0.9,
      system: '你是对方同龄的同学兼好朋友。说话轻松随意、活泼，爱开玩笑，会聊学习、游戏、八卦和日常，偶尔用年轻人常用的口语。称呼对方用你或咱们。请始终以同学朋友的身份自然聊天，用中文，回复简短，一般两到五句，像真人一样，不要提及你是AI或模型，不要使用列表或Markdown格式。'
    },
    {
      id: 'mentor', name: '职场前辈', emoji: '💼',
      tagline: '干练专业，给你实在的建议', color: '#8d6e63', bg: '#efe6df',
      greeting: '来了。最近工作还顺利吗？聊聊？', temperature: 0.8,
      system: '你是一位经验丰富、干练的职场前辈兼导师。说话有条理、务实，会给出具体可行的建议和方法，关注效率、成长和心态，语气鼓励又不失专业。请始终以职场前辈的身份自然聊天，用中文，回复简短，一般两到五句，像真人一样，不要提及你是AI或模型，不要使用列表或Markdown格式。'
    },
    {
      id: 'doctor', name: '医生', emoji: '🩺',
      tagline: '专业耐心，为你答疑解惑', color: '#5b8c85', bg: '#e2eeea',
      greeting: '你好，我是医生。身体有什么不舒服的地方吗？', temperature: 0.5,
      system: '你是一位专业、耐心、可靠的医生。会用通俗易懂的话解答健康问题，关心对方的身体状况，给出科学的建议，并在必要时提醒对方去医院就诊。请始终以医生的身份自然聊天，用中文，回复简短，一般两到五句，像真人一样，不要提及你是AI或模型，不要使用列表或Markdown格式。'
    },
    {
      id: 'assistant', name: 'AI助手', emoji: '🤖',
      tagline: '理性高效，直接给你答案', color: '#7c6fb0', bg: '#edeaf7',
      greeting: '你好，我是你的AI助手。有什么可以帮你的？', temperature: 0.5,
      system: '你是一位理性、高效、准确的AI助手。回答清晰、有条理，直接给出准确的答案，需要时可以分点说明，语气专业友好。你可以说明自己是AI助手。请用中文，回复简洁准确。'
    }
  ];

  var CONFIG_KEY = 'warm_chat_config_v1';
  var state = { persona: null, history: [], busy: false };

  function loadConfig() {
    try {
      var raw = localStorage.getItem(CONFIG_KEY);
      if (raw) {
        var c = JSON.parse(raw);
        return {
          apiKey: c.apiKey || '',
          baseUrl: (c.baseUrl || 'https://api.deepseek.com').replace(/\/+$/, ''),
          model: c.model || 'deepseek-chat'
        };
      }
    } catch (e) { /* ignore */ }
    return { apiKey: '', baseUrl: 'https://api.deepseek.com', model: 'deepseek-chat' };
  }

  function saveConfig(cfg) {
    try { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }
  }

  var app = document.getElementById('app');
  var settingsOverlay = document.getElementById('settingsOverlay');
  var apiKeyInput = document.getElementById('apiKeyInput');
  var baseUrlInput = document.getElementById('baseUrlInput');
  var modelInput = document.getElementById('modelInput');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function openSettings() {
    var cfg = loadConfig();
    apiKeyInput.value = cfg.apiKey;
    baseUrlInput.value = cfg.baseUrl;
    modelInput.value = cfg.model;
    settingsOverlay.classList.add('show');
  }

  function closeSettings() {
    settingsOverlay.classList.remove('show');
  }

  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  document.getElementById('settingsCancel').addEventListener('click', closeSettings);
  document.getElementById('settingsSave').addEventListener('click', function () {
    saveConfig({
      apiKey: apiKeyInput.value.trim(),
      baseUrl: baseUrlInput.value.trim() || 'https://api.deepseek.com',
      model: modelInput.value.trim() || 'deepseek-chat'
    });
    closeSettings();
  });
  settingsOverlay.addEventListener('click', function (e) {
    if (e.target === settingsOverlay) closeSettings();
  });

  function renderSelect() {
    app.innerHTML = '';
    var wrap = el('div', 'hero');
    var logo = el('div', 'logo'); logo.textContent = '☀';
    var h1 = el('h1', 'title'); h1.textContent = '找一个伙伴，聊聊天';
    var sub = el('p', 'subtitle'); sub.textContent = '选择一位你此刻想对话的人';
    var grid = el('div', 'grid');
    PERSONAS.forEach(function (p) {
      var card = el('button', 'card');
      card.setAttribute('type', 'button');
      card.style.setProperty('--c', p.color);
      card.style.setProperty('--bg', p.bg);
      var av = el('div', 'avatar'); av.textContent = p.emoji;
      var nm = el('div', 'name'); nm.textContent = p.name;
      var tg = el('div', 'tag'); tg.textContent = p.tagline;
      card.appendChild(av); card.appendChild(nm); card.appendChild(tg);
      card.addEventListener('click', function () { selectPersona(p); });
      grid.appendChild(card);
    });
    var foot = el('div', 'footer');
    foot.textContent = '回复由大模型生成 · 密钥仅存于本地浏览器';
    wrap.appendChild(logo); wrap.appendChild(h1); wrap.appendChild(sub);
    wrap.appendChild(grid); wrap.appendChild(foot);
    app.appendChild(wrap);
  }

  function selectPersona(p) {
    state.persona = p;
    state.history = [];
    renderChat();
    addMessage('assistant', p.greeting);
  }

  function renderChat() {
    var p = state.persona;
    app.innerHTML = '';
    var shell = el('div', 'chat');
    var head = el('div', 'chathead');
    var back = el('button', 'back');
    back.setAttribute('type', 'button');
    back.textContent = '‹ 返回';
    back.addEventListener('click', renderSelect);
    var who = el('div', 'who');
    var av = el('div', 'avatar sm'); av.textContent = p.emoji;
    av.style.setProperty('--c', p.color); av.style.setProperty('--bg', p.bg);
    var nm = el('div', 'name'); nm.textContent = p.name;
    var tg = el('div', 'tag'); tg.textContent = p.tagline;
    who.appendChild(av); who.appendChild(nm); who.appendChild(tg);
    head.appendChild(back); head.appendChild(who);

    var msgs = el('div', 'messages'); msgs.id = 'messages';
    var inputbar = el('div', 'inputbar');
    var input = el('input', 'input'); input.id = 'chat-input';
    input.setAttribute('placeholder', '和' + p.name + '说点什么…');
    input.setAttribute('autocomplete', 'off');
    var send = el('button', 'send'); send.textContent = '发送';
    send.setAttribute('type', 'button');
    inputbar.appendChild(input); inputbar.appendChild(send);

    shell.appendChild(head); shell.appendChild(msgs); shell.appendChild(inputbar);
    app.appendChild(shell);

    function submit() {
      var text = input.value.trim();
      if (!text || state.busy) return;
      var cfg = loadConfig();
      if (!cfg.apiKey) {
        openSettings();
        addMessage('assistant', '（还没有配置 API Key，先点右上角「接口设置」填一下，就能开始聊天啦）');
        return;
      }
      input.value = '';
      addMessage('user', text);
      state.history.push({ role: 'user', content: text });
      setTyping(true);
      state.busy = true;
      send.disabled = true;

      var msgs = [{ role: 'system', content: state.persona.system }]
        .concat(state.history.map(function (m) { return { role: m.role, content: m.content }; }));

      fetch(cfg.baseUrl + '/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + cfg.apiKey
        },
        body: JSON.stringify({
          model: cfg.model,
          messages: msgs,
          temperature: state.persona.temperature,
          stream: false
        })
      }).then(function (resp) {
        return resp.json().then(function (data) {
          if (!resp.ok) {
            throw { status: resp.status, data: data };
          }
          return data;
        });
      }).then(function (data) {
        var reply = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        if (reply) {
          state.history.push({ role: 'assistant', content: reply });
          addMessage('assistant', reply);
        } else {
          addMessage('assistant', '（没有收到有效回复，请检查接口返回格式）');
        }
      }).catch(function (e) {
        if (e && e.status) {
          if (e.status === 401) addMessage('assistant', '（接口返回 401：API Key 无效或未授权，请检查密钥）');
          else if (e.status === 404) addMessage('assistant', '（接口返回 404：Base URL 或路径不正确）');
          else if (e.status === 429) addMessage('assistant', '（请求过于频繁，稍后再试）');
          else {
            var msg = (e.data && e.data.error && e.data.error.message) || ('状态码 ' + e.status);
            addMessage('assistant', '（接口错误：' + msg + '）');
          }
        } else {
          addMessage('assistant', '（无法连接接口：可能是浏览器跨域 CORS 被拦截，或网络不通。请确认 Base URL 支持浏览器跨域，或改用你自己的后端/代理地址）');
        }
      }).finally(function () {
        setTyping(false);
        state.busy = false;
        send.disabled = false;
      });
    }

    send.addEventListener('click', submit);
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') submit();
    });
    input.focus();
  }

  function addMessage(role, text) {
    var box = document.getElementById('messages');
    if (!box) return;
    var row = el('div', 'msg ' + role);
    if (role === 'assistant' && state.persona) {
      var av = el('div', 'avatar xs'); av.textContent = state.persona.emoji;
      av.style.setProperty('--c', state.persona.color);
      av.style.setProperty('--bg', state.persona.bg);
      row.appendChild(av);
    }
    var b = el('div', 'bubble'); b.textContent = text;
    row.appendChild(b);
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
  }

  function setTyping(show) {
    var box = document.getElementById('messages');
    if (!box) return;
    var existing = document.getElementById('typing');
    if (show) {
      if (existing) return;
      var row = el('div', 'msg assistant');
      if (state.persona) {
        var av = el('div', 'avatar xs'); av.textContent = state.persona.emoji;
        av.style.setProperty('--c', state.persona.color);
        av.style.setProperty('--bg', state.persona.bg);
        row.appendChild(av);
      }
      var b = el('div', 'bubble typing'); b.id = 'typing';
      for (var i = 0; i < 3; i++) b.appendChild(el('span', 'dot'));
      row.appendChild(b);
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    } else {
      if (existing) existing.parentNode.remove();
      box.scrollTop = box.scrollHeight;
    }
  }

  renderSelect();
})();
</script>
</body>
</html>
